<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Score Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">
        <h1 class="text-3xl font-bold mb-6 text-center">ATS Score Checker</h1>
        <form action="/upload" method="post" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label for="resume" class="block text-lg font-medium text-gray-700">Upload Resume (PDF or Text)</label>
                <input type="file" name="resume" accept=".pdf" class="mt-2 block w-full border border-gray-300 rounded-md p-2">
                <textarea name="resume_text" rows="5" placeholder="Or paste resume text here..." class="mt-2 block w-full border border-gray-300 rounded-md p-2"></textarea>
            </div>
            <div>
                <label for="job_description" class="block text-lg font-medium text-gray-700">Upload Job Description (PDF or Text)</label>
                <input type="file" name="job_description" accept=".pdf" class="mt-2 block w-full border border-gray-300 rounded-md p-2">
                <textarea name="job_desc_text" rows="5" placeholder="Or paste job description text here..." class="mt-2 block w-full border border-gray-300 rounded-md p-2"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Check ATS Score</button>
        </form>
    </div>
</body>
</html>
